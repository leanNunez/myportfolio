<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
<style>
.l{stroke:#ff7a6b;stroke-width:1.6}.d{stroke:#3a4552;stroke-width:1.2}.m{stroke:#8b95a1;stroke-width:1.2}.a{stroke:#d7dce2;stroke-width:1.6}
.p{fill:#10151c}.t{fill:#8b95a1;stroke:none;font:600 9px ui-monospace,monospace}
.blink{animation:b 1.1s steps(2,end) infinite}@keyframes b{50%{opacity:0}}
.flow{stroke-dasharray:4 5;animation:f 1.6s linear infinite}@keyframes f{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){.blink,.flow{animation:none}}
</style>
<rect width="320" height="200" fill="#0a0d12"/>
